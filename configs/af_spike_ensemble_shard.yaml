apiVersion: batch/v1
kind: Job
metadata:
  name: af-spike-ensemble-${TEAM}
  labels:
    kueue.x-k8s.io/queue-name: student-queue
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 2x4
      containers:
      - name: af-spike-ensemble
        image: python:3.12-slim
        command: ["bash", "-c"]
        args:
          - |
            set -uxo pipefail
            apt-get update && apt-get install -y --no-install-recommends git curl && rm -rf /var/lib/apt/lists/*
            pip install --no-cache-dir -q uv
            uv pip install --system --no-cache \
              "jax[tpu]==0.10.2" \
              dm-haiku ml_collections absl-py "tensorflow-cpu>=2.18" biopython numpy \
              -f https://storage.googleapis.com/jax-releases/libtpu_releases.html
            git clone --depth 1 https://github.com/google-deepmind/alphafold.git /alphafold
            cp /mnt/script/spike_ensemble_shard_forward_pass.py /alphafold/spike_ensemble_shard_forward_pass.py
            cd /alphafold

            python3 spike_ensemble_shard_forward_pass.py \
              --run_tag=tpu-v5e-podslice --num_residues=118 --num_ensemble=8 \
              || echo "!!! ensemble-shard experiment FAILED !!!"

            echo "############################################"
            echo "# All result JSONs"
            echo "############################################"
            ls -la results/*.json 2>/dev/null || echo "(none)"
            echo "=== DONE, sleeping 90s so you can grab logs before cleanup ==="
            sleep 90
        resources:
          requests:
            google.com/tpu: "8"
            memory: 32Gi
          limits:
            google.com/tpu: "8"
            memory: 64Gi
        volumeMounts:
          - { name: script, mountPath: /mnt/script }
      volumes:
        - name: script
          configMap:
            name: af-ensemble-script-${TEAM}
