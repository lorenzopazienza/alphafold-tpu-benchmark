apiVersion: batch/v1
kind: Job
metadata:
  name: af-spike-${TEAM}
  labels:
    kueue.x-k8s.io/queue-name: student-queue   # admits the Job through the class TPU quota
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice   # CORRECTED: was tpu-v6e-slice (wrong doc)
        cloud.google.com/gke-tpu-topology: 2x4
      containers:
      - name: af-spike
        image: python:3.12-slim
        command: ["bash", "-c"]
        args:
          - |
            set -euxo pipefail
            apt-get update && apt-get install -y --no-install-recommends git curl && rm -rf /var/lib/apt/lists/*

            # Install uv via pip (not the curl script) -- avoids $HOME
            # ambiguity between /root and /home/admin inside this container
            # that put uv's binary in a directory not on PATH last time.
            pip install --no-cache-dir -q uv

            uv pip install --system --no-cache \
              "jax[tpu]==0.10.2" \
              dm-haiku ml_collections absl-py "tensorflow-cpu>=2.18" biopython numpy \
              -f https://storage.googleapis.com/jax-releases/libtpu_releases.html

            git clone --depth 1 https://github.com/google-deepmind/alphafold.git /alphafold
            cp /mnt/script/spike_tpu_forward_pass.py /alphafold/spike_tpu_forward_pass.py
            cd /alphafold
            python3 spike_tpu_forward_pass.py --run_tag=tpu-v5e-podslice
        resources:
          requests:
            google.com/tpu: "8"
            memory: 32Gi
          limits:
            google.com/tpu: "8"
            memory: 64Gi
        volumeMounts:
          - { name: script, mountPath: /mnt/script }
      volumes:
        - name: script
          configMap:
            name: af-spike-script-${TEAM}
